# This runs the PostgreSQL database in Docker so you don't have to install Postgres on your computer.
# docker compose up -d db only starts the database, use this when you run the app from IntelliJ.
# docker compose up --build starts the database and the API together, both in Docker.
# Stop everything with docker compose down.
services:
  db:
    # Postgres version 16, alpine is just a smaller version of the image so it downloads quicker.
    image: postgres:16-alpine
    # These make the database and the user the first time it starts, they match what's in application.yml
    # They only work the first time when the database is empty, if you change the password in .env later the database keeps the old one.
    # To start fresh with a new password you have to delete the data with docker compose down -v.
    environment:
      POSTGRES_DB: financetracker
      POSTGRES_USER: financetracker
      # Docker Compose reads DB_PASSWORD from the .env file in the same folder by itself.
      # The :? bit makes it stop with that message if DB_PASSWORD isn't set, instead of starting with no password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Connects port 5432 on your computer to port 5432 in the container so the app can reach the database at localhost:5432
    ports:
      - "5432:5432"
      # Saves the database files in a Docker volume called pgdata so your data is still there after you stop or restart the container.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker checks every 5 seconds if the database is actually ready for connections, not just switched on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financetracker -d financetracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API itself, built from the DockerFile in this folder.
  api:
    build: .
    # Waits until the database passes its healthcheck before starting the app.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database isn't at localhost, it's at db which is the name of the service above.
      DB_URL: jdbc:postgresql://db:5432/financetracker
      # Same secrets as before, Docker Compose reads them from .env and hands them to the app.
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"

# This makes the pgdata volume, Docker manages where it's actually stored.
volumes:
  pgdata:
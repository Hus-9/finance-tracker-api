# GitHub runs this by itself every time code gets pushed to main or someone opens a pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # A fresh Linux computer from GitHub, it already has Docker whiich the Testcontainers tests need.
    runs-on: ubuntu-latest
    steps:
      # Downloads the code from the repo onto that computer.
      - uses: actions/checkout@v7

      # Installs Java 21 and saves the Maven downloads so the next run is quicker.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Builds the app and runs all 18 tests, if any test fails the whole run goes red.
      - name: Build and run all tests
        run: mvn -B verify

      # Saves the JaCoCo report so you can download it from the run page, always mean it still uploads even if a test failed.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
spring:
  application:
    name: finance-tracker
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/financetracker
    username: financetracker
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
